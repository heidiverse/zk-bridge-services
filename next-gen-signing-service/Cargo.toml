serde = { workspace = true }
sha2 = "0.10.9"
serde_json = "1.0.132"
serde_urlencoded = "0.7.1"

[dev-dependencies]
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-std = { workspace = true }
zkp-util = { git = "https://github.com/KapunSDK/kapun-sdk.git", rev = "3c11503c4bdf4272eb0a73c27bf51933c4d50528" }
